[package]
name = "recall"
version = "0.1.0"
edition = "2021"
authors = ["Niklas Marder"]
description = "Local-first long-term memory for AI coding agents, exposed over the Model Context Protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niklasmarderx/recall"
homepage = "https://github.com/niklasmarderx/recall"
keywords = ["mcp", "memory", "ai", "agent", "llm"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
